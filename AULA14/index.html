<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 14</title>
    <link rel="stylesheet" href="./Css/style.css">
</head>
<body>
    <h1>Flexbox</h1>
    <p>O flexbox (ou flexible box layout) é um modelo de layout do CSS criado para facilitar a organização, alinhamento e distribuição de espaço entre os elementos dentro de um container</p>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</body>
