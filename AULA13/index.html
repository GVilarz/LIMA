<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 13</title>
    <link rel="stylesheet" href="./Css/style.css">
</head>
<body>

    <h1>Entendendo o Display</h1>

    <p>
        O <strong>Display</strong> define como um elemento se comporta na página
    </p>

    <!-- BLOCK -->
     <h2>1. Block</h2>
     <div class="block">Caixa 1</div>   
     <div class="block">Caixa 2</div>   
     <div class="block">Caixa 3</div>   

     <!-- INLINE -->
      <h2>2. InLine</h2>
      <div class="inline">Caixa 1</div>
      <div class="inline">Caixa 2</div>
      <div class="inline">Caixa 3</div>

     <!-- INLINE BLOCK -->
      <h2>2. InLine Block</h2>
      <div class="inline-block">Caixa 1</div>
      <div class="inline-block">Caixa 2</div>
      <div class="inline-block">Caixa 3</div>
</body>
</html>
