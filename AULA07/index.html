<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 07</title>
</head>
<body>
    <!-- TABELAS -->
    <!-- 
    <table> = Define a tabela
    <thead> = Define a região do Cabeçalho
    <tr> = Define uma linha da tabela
    <th> = Define um cabeçalho (deixa em negrito)
    <tbody> = Define a região do corpo
    <td> = Define uma célula (Dados da tabela)
    border="1" = Adiciona bordas na tabela
    -->
    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana</td>
                <td>17</td>
                <td>Paris</td>
            </tr>
            <tr>
                <td>Vilar</td>
                <td>17</td>
                <td>Cabul</td>
            </tr>
        </tbody>
    </table>





    
</body>
</html>
