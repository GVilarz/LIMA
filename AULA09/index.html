<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo</title>

    <!-- CSS interno
    Ele fica dentro da tag <style> no <head> do HTML -->
    <style>
        h1 {
            color: rgb(226, 170, 15);
        }
    </style>

    <!-- CSS Externo - O melhor de todos-->
     <link rel="stylesheet" href="./CSS/style.css">

</head>
<body>
    <!-- CSS (Cascading Style Sheets) é o que dá forma, cor, desing e estilo ao HTML -->

    <!-- CSS inline
    Definio diretamente na tag HTML, dentro do atributo style=""
    Quando usar?
    Quando você precisa estilizar um único elemento rapidamente (ex: testar uma cor diferente de botão)
    -->
    <h1 style="font-size: 120px;">Titulo em Vermelho</h1>

    <h2>DSI1 SESI - OS MELHORES</h2>
</body>
</html>
